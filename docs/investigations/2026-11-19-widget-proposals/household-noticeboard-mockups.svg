<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc"><title id="title">Household noticeboard size and phone mockups</title><desc id="desc">Illustrative 1 by 1 glance, recommended card, wide card, richer full-screen view and phone configuration.</desc><g font-family="Arial, sans-serif"><rect width="1200" height="1030" fill="#101b27"/><text x="24" y="39" fill="#e7eef5" font-size="28" font-weight="bold">Household noticeboard · proposed presentations</text><text x="24" y="69" fill="#a7becf" font-size="17" font-weight="normal">Illustrative values and labels · design mockup, not a working app capture</text><text x="24" y="105" fill="#93e1cc" font-size="18" font-weight="normal">1×1</text><rect x="24" y="122" width="164" height="164" rx="15" fill="#3c405f" stroke="#678298"/><text x="37" y="157" fill="#c4d3df" font-size="21" font-weight="normal">2 pinned notes</text><text x="37" y="259" fill="#e7eef5" font-size="15" font-weight="normal">OK → details</text><text x="208" y="105" fill="#93e1cc" font-size="18" font-weight="normal">Recommended 3×2</text><rect x="208" y="122" width="452" height="164" rx="15" fill="#3c405f" stroke="#678298"/><text x="224" y="156" fill="#e7eef5" font-size="26" font-weight="bold">2 pinned notes</text><text x="224" y="191" fill="#e7eef5" font-size="18" font-weight="normal">Dinner is in the fridge</text><text x="224" y="220" fill="#e7eef5" font-size="18" font-weight="normal">Please bring the parcel inside</text><text x="224" y="249" fill="#e7eef5" font-size="18" font-weight="normal">Edited today · On this TV</text><text x="680" y="105" fill="#93e1cc" font-size="18" font-weight="normal">Wide / shallow</text><rect x="680" y="122" width="496" height="164" rx="15" fill="#3c405f" stroke="#678298"/><text x="696" y="156" fill="#e7eef5" font-size="26" font-weight="bold">2 pinned notes</text><text x="696" y="191" fill="#e7eef5" font-size="18" font-weight="normal">Dinner is in the fridge</text><text x="696" y="220" fill="#e7eef5" font-size="18" font-weight="normal">Please bring the parcel inside</text><text x="696" y="249" fill="#e7eef5" font-size="18" font-weight="normal">Edited today · On this TV</text><text x="24" y="327" fill="#93e1cc" font-size="20" font-weight="normal">Full screen · additional records, detail and actions</text><rect x="24" y="346" width="700" height="596" rx="15" fill="#22354a" stroke="#678298"/><rect x="42" y="365" width="188" height="42" rx="15" fill="#344b60" stroke="#678298"/><text x="54" y="393" fill="#e7eef5" font-size="18" font-weight="normal">Restore dashboard</text><text x="251" y="395" fill="#e7eef5" font-size="24" font-weight="bold">Household noticeboard</text><rect x="44" y="429" width="656" height="70" rx="15" fill="#3c405f" stroke="#678298"/><text x="60" y="457" fill="#c4d3df" font-size="19" font-weight="normal">Pinned · Dinner is in the fridge</text><rect x="44" y="514" width="656" height="70" rx="15" fill="#3c405f" stroke="#678298"/><text x="60" y="542" fill="#c4d3df" font-size="19" font-weight="normal">Please bring the parcel inside</text><rect x="44" y="599" width="656" height="70" rx="15" fill="#3c405f" stroke="#678298"/><text x="60" y="627" fill="#c4d3df" font-size="19" font-weight="normal">Unpinned · Wi-Fi guest instructions</text><rect x="44" y="684" width="656" height="70" rx="15" fill="#3c405f" stroke="#678298"/><text x="60" y="712" fill="#c4d3df" font-size="19" font-weight="normal">Archive · Previous household messages</text><text x="48" y="802" fill="#c4d3df" font-size="19" font-weight="normal">Selected item details, source / saved status, and</text><text x="48" y="829" fill="#c4d3df" font-size="19" font-weight="normal">explicit actions live here.</text><text x="48" y="903" fill="#93e1cc" font-size="18" font-weight="normal">Back → original page, focus and saved size</text><text x="758" y="327" fill="#93e1cc" font-size="18" font-weight="normal">Phone · existing approved TV session</text><rect x="758" y="346" width="418" height="650" rx="15" fill="#172a38" stroke="#678298"/><text x="780" y="388" fill="#e7eef5" font-size="23" font-weight="bold">Living room TV · Example</text><text x="780" y="423" fill="#e7eef5" font-size="19" font-weight="normal">Edit Household noticeboard</text><text x="780" y="470" fill="#c4d3df" font-size="17" font-weight="normal">Message</text><rect x="780" y="487" width="372" height="49" rx="15" fill="#263c4b" stroke="#678298"/><text x="794" y="518" fill="#a8bccb" font-size="17" font-weight="normal">Choose or enter…</text><text x="780" y="588" fill="#c4d3df" font-size="17" font-weight="normal">Pin to dashboard</text><rect x="780" y="605" width="372" height="49" rx="15" fill="#263c4b" stroke="#678298"/><text x="794" y="636" fill="#a8bccb" font-size="17" font-weight="normal">Choose or enter…</text><text x="780" y="706" fill="#c4d3df" font-size="17" font-weight="normal">Show until · optional</text><rect x="780" y="723" width="372" height="49" rx="15" fill="#263c4b" stroke="#678298"/><text x="794" y="754" fill="#a8bccb" font-size="17" font-weight="normal">Choose or enter…</text><rect x="780" y="849" width="372" height="52" rx="15" fill="#28695c" stroke="#678298"/><text x="794" y="883" fill="#e7eef5" font-size="19" font-weight="normal">Save note</text><text x="780" y="927" fill="#e7eef5" font-size="18" font-weight="normal">Review changes → Update TV</text><text x="780" y="963" fill="#a8bccb" font-size="17" font-weight="normal">Back cancels unsaved edits</text></g></svg>