<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Countdowns and timers workflow</title><desc id="desc">Six-step workflow with failure retention and retry branch.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#96dcca"/></marker></defs><rect width="1200" height="690" fill="#101b27"/><g font-family="Arial, sans-serif"><text x="24" y="37" fill="#e7eef5" font-size="25" font-weight="bold">Countdowns and timers · workflow</text><rect x="72" y="65" width="710" height="62" rx="15" fill="#513e4c" stroke="#678298"/><text x="92" y="104" fill="#e7eef5" font-size="22" font-weight="normal">1 · Choose duration or dated occasion</text><path d="M427 127V159" fill="none" stroke="#96dcca" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="163" width="710" height="62" rx="15" fill="#513e4c" stroke="#678298"/><text x="92" y="202" fill="#e7eef5" font-size="22" font-weight="normal">2 · Review name / zone / finish behavior</text><path d="M427 225V257" fill="none" stroke="#96dcca" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="261" width="710" height="62" rx="15" fill="#513e4c" stroke="#678298"/><text x="92" y="300" fill="#e7eef5" font-size="22" font-weight="normal">3 · Persist explicit Start or Save</text><path d="M427 323V355" fill="none" stroke="#96dcca" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="359" width="710" height="62" rx="15" fill="#513e4c" stroke="#678298"/><text x="92" y="398" fill="#e7eef5" font-size="22" font-weight="normal">4 · Render remaining or elapsed time</text><path d="M427 421V453" fill="none" stroke="#96dcca" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="457" width="710" height="62" rx="15" fill="#513e4c" stroke="#678298"/><text x="92" y="496" fill="#e7eef5" font-size="22" font-weight="normal">5 · Pause / finish / acknowledge</text><path d="M427 519V551" fill="none" stroke="#96dcca" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="555" width="710" height="62" rx="15" fill="#513e4c" stroke="#678298"/><text x="92" y="594" fill="#e7eef5" font-size="22" font-weight="normal">6 · Restart or wall-clock change reconciles</text><rect x="858" y="250" width="318" height="168" rx="15" fill="#5c3a37" stroke="#678298"/><text x="876" y="284" fill="#c4d3df" font-size="20" font-weight="normal">Validation, connection</text><text x="876" y="311" fill="#c4d3df" font-size="20" font-weight="normal">or source failure</text><text x="876" y="352" fill="#c4d3df" font-size="18" font-weight="normal">Keep saved data / draft.</text><text x="876" y="379" fill="#c4d3df" font-size="18" font-weight="normal">Explain and retry.</text><path d="M782 292H852" fill="none" stroke="#96dcca" stroke-width="2" marker-end="url(#arrow)"/><path d="M1017 250V194H788" fill="none" stroke="#96dcca" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="663" fill="#a7becf" font-size="19" font-weight="normal">No silent overwrite, false success or automatic dashboard rearrangement.</text></g></svg>