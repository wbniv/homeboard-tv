<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <rect width="1600" height="1120" fill="#101723"/>
  <g font-family="sans-serif" fill="#edf3ff">
    <text x="70" y="70" font-size="34" font-weight="700">Home behavior · Grid settings</text>
    <text x="70" y="110" font-size="20" fill="#aabbd0">Fixed choice cards · current value highlighted · no scrolling</text>
    <rect x="120" y="155" width="1360" height="300" rx="28" fill="#1b293b" stroke="#41556e" stroke-width="2"/>
    <text x="165" y="210" font-size="25" font-weight="700">Grid columns</text>
    <text x="165" y="246" font-size="18" fill="#b9c9db">Auto targets 9; fixed counts stop at this screen's measured fit.</text>
    <g text-anchor="middle">
      <g transform="translate(165 282)"><rect width="180" height="120" rx="18" fill="#2a4560" stroke="#91caff" stroke-width="4"/><text x="90" y="53" font-size="27">Auto</text><text x="90" y="86" font-size="16" fill="#b9c9db">Current · 9</text></g>
      <g transform="translate(375 282)"><rect width="150" height="120" rx="18" fill="#26364a" stroke="#41556e" stroke-width="2"/><text x="75" y="68" font-size="25">4</text></g>
      <g transform="translate(555 282)"><rect width="150" height="120" rx="18" fill="#26364a" stroke="#41556e" stroke-width="2"/><text x="75" y="68" font-size="25">6</text></g>
      <g transform="translate(735 282)"><rect width="150" height="120" rx="18" fill="#26364a" stroke="#41556e" stroke-width="2"/><text x="75" y="68" font-size="25">8</text></g>
      <g transform="translate(915 282)"><rect width="150" height="120" rx="18" fill="#26364a" stroke="#41556e" stroke-width="2"/><text x="75" y="68" font-size="25">10</text></g>
      <g transform="translate(1095 282)"><rect width="150" height="120" rx="18" fill="#26364a" stroke="#41556e" stroke-width="2"/><text x="75" y="68" font-size="25">12</text></g>
    </g>
    <rect x="120" y="850" width="1360" height="220" rx="28" fill="#1b293b" stroke="#41556e" stroke-width="2"/>
    <text x="165" y="905" font-size="25" font-weight="700">New panel size</text>
    <text x="165" y="940" font-size="18" fill="#b9c9db">Default for panels added later · existing panels keep their own size</text>
    <g text-anchor="middle">
      <g transform="translate(225 965)"><rect width="300" height="78" rx="18" fill="#26364a" stroke="#41556e" stroke-width="2"/><text x="150" y="49" font-size="24">Small · ⅓</text></g>
      <g transform="translate(650 965)"><rect width="300" height="78" rx="18" fill="#2a4560" stroke="#91caff" stroke-width="4"/><text x="150" y="49" font-size="24">Medium · ½ · Current</text></g>
      <g transform="translate(1075 965)"><rect width="300" height="78" rx="18" fill="#26364a" stroke="#41556e" stroke-width="2"/><text x="150" y="49" font-size="24">Large · ¾</text></g>
    </g>
    <rect x="120" y="495" width="1360" height="310" rx="28" fill="#1b293b" stroke="#41556e" stroke-width="2"/>
    <text x="165" y="550" font-size="25" font-weight="700">Grid rows</text>
    <text x="165" y="586" font-size="18" fill="#b9c9db">Auto or every count from 2 to the measured fit · example display fits 6</text>
    <g text-anchor="middle">
      <g transform="translate(165 625)"><rect width="180" height="120" rx="18" fill="#2a4560" stroke="#91caff" stroke-width="4"/><text x="90" y="53" font-size="25">Auto</text><text x="90" y="86" font-size="16" fill="#b9c9db">Current · 6</text></g>
      <g transform="translate(375 625)"><rect width="150" height="120" rx="18" fill="#26364a" stroke="#41556e" stroke-width="2"/><text x="75" y="68" font-size="25">2</text></g>
      <g transform="translate(555 625)"><rect width="150" height="120" rx="18" fill="#26364a" stroke="#41556e" stroke-width="2"/><text x="75" y="68" font-size="25">3</text></g>
      <g transform="translate(735 625)"><rect width="150" height="120" rx="18" fill="#26364a" stroke="#41556e" stroke-width="2"/><text x="75" y="68" font-size="25">4</text></g>
      <g transform="translate(915 625)"><rect width="150" height="120" rx="18" fill="#26364a" stroke="#41556e" stroke-width="2"/><text x="75" y="68" font-size="25">5</text></g>
      <g transform="translate(1095 625)"><rect width="150" height="120" rx="18" fill="#26364a" stroke="#41556e" stroke-width="2"/><text x="75" y="68" font-size="25">6</text></g>
