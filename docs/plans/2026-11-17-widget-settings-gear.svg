<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Shared expanded-widget header with a settings gear</title>
<desc id="desc">Restore dashboard on the left, the widget title, and a square gear button on the right. The gear retains the Configure accessibility name. This header is shared by all expanded widgets.</desc>
