<text x="293" y="629" font-size="15" fill="#edf2fa">Netflix</text>
<circle cx="460" cy="580" r="27" fill="#22617e"/>
<text x="451" y="588" font-size="23" fill="#edf2fa" font-weight="bold">K</text>
<text x="418" y="629" font-size="15" fill="#edf2fa">Kodi</text>
<circle cx="585" cy="580" r="27" fill="#6b4587"/>
