<text x="668" y="629" font-size="15" fill="#edf2fa">Photos</text>
<circle cx="835" cy="580" r="27" fill="#5e6045"/>
<text x="826" y="588" font-size="23" fill="#edf2fa" font-weight="bold">P</text>
<text x="793" y="629" font-size="15" fill="#edf2fa">Plex</text>
