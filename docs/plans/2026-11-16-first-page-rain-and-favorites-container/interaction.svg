<text x="1105" y="349" font-size="17" fill="#acbfd0">Exit at side edge →</text>
<text x="280" y="411" font-size="23" fill="#edf2fa" font-weight="bold">↓ Next internal row: scroll Favorites; Rain and Calendar do not move.</text>
<text x="280" y="446" font-size="20" fill="#acbfd0">At the last internal row: Down exits the panel if an outer target exists.</text>
<text x="40" y="513" font-size="25" fill="#edf2fa" font-weight="bold">One-row ribbon · horizontal overflow</text>
<rect x="40" y="540" width="900" height="120" rx="16" fill="#1b2a3c" stroke="#486680" stroke-width="2"/>
<text x="60" y="570" font-size="20" fill="#edf2fa" font-weight="bold">Favorites</text>
