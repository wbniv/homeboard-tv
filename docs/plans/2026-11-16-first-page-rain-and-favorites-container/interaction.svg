<text x="980" y="575" font-size="22" fill="#edf2fa">Right wedge: more apps →</text>
<text x="980" y="614" font-size="20" fill="#acbfd0">No scrollbar. Exit at list ends.</text>
<text x="40" y="722" font-size="25" fill="#edf2fa" font-weight="bold">1×1 · compact opener</text>
<rect x="40" y="750" width="130" height="125" rx="16" fill="#1b2a3c" stroke="#486680" stroke-width="2"/>
<text x="54" y="791" font-size="20" fill="#edf2fa" font-weight="bold">Favorites</text>
<text x="54" y="826" font-size="21" fill="#edf2fa">18 apps</text>
<text x="54" y="857" font-size="16" fill="#acbfd0">OK to open</text>
<text x="210" y="791" font-size="23" fill="#edf2fa">Opens a larger Favorites browser.</text>
<text x="210" y="830" font-size="20" fill="#acbfd0">Back restores this tile, app focus and scroll anchor.</text>
<text x="40" y="937" font-size="27" fill="#edf2fa" font-weight="bold">Two distinct operations</text>
<rect x="40" y="966" width="690" height="200" rx="16" fill="#1b2a3c" stroke="#486680" stroke-width="2"/>
<text x="64" y="1002" font-size="24" fill="#edf2fa" font-weight="bold">Hold OK on an app → App actions</text>
<text x="64" y="1043" font-size="22" fill="#edf2fa">Reorder apps / Unfavorite / Android actions</text>
<text x="64" y="1081" font-size="20" fill="#acbfd0">“Favorites widget actions” opens panel controls.</text>
<text x="64" y="1124" font-size="19" fill="#acbfd0">Internal app order changes; outer span stays fixed.</text>
<rect x="770" y="966" width="700" height="200" rx="16" fill="#1b2a3c" stroke="#486680" stroke-width="2"/>
<text x="794" y="1002" font-size="24" fill="#edf2fa" font-weight="bold">Hold OK on header → Widget actions</text>
<text x="794" y="1043" font-size="22" fill="#edf2fa">Move panel / Resize panel / Artwork / Remove</text>
<text x="794" y="1081" font-size="20" fill="#acbfd0">D-pad previews the outer placement or dimensions.</text>
<text x="794" y="1124" font-size="19" fill="#acbfd0">OK saves · Back cancels · Undo restores.</text>
<text x="40" y="1220" font-size="22" fill="#edf2fa">Header is always reachable: Back from an app, or Up from the first row. Up again leaves the header.</text>
<text x="40" y="1260" font-size="19" fill="#acbfd0">Reduced motion: instant scrolling; no spring animation. Focus halos stay fully inside the content viewport.</text>
</svg>
