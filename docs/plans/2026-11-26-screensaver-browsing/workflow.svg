<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="640" viewBox="0 0 1260 640"><defs><linearGradient id="tank" x2="1" y2="1"><stop stop-color="#12495d"/><stop offset="1" stop-color="#102b39"/></linearGradient><linearGradient id="clock" x2="1" y2="1"><stop stop-color="#5b3b90"/><stop offset="1" stop-color="#252044"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8fe0c6" stroke-width="1.3"/></marker><clipPath id="rail"><rect x="58" y="158" width="428" height="650" rx="10"/></clipPath></defs><rect width="100%" height="100%" fill="#101722"/><g font-family="Arial, sans-serif"><text x="45" y="60" fill="#f0f3f7" font-size="34" font-weight="700">Browse, act, return to the same place</text><rect x="45" y="280" width="260" height="108" rx="14" fill="#202a37" stroke="#425063" stroke-width="1"/><text x="65" y="318" fill="#f0f3f7" font-size="25" font-weight="700">Home settings</text><text x="65" y="353.0" fill="#afbbc9" font-size="18" font-weight="400">Screensaver entry</text><rect x="400" y="280" width="310" height="108" rx="14" fill="#202a37" stroke="#425063" stroke-width="1"/><text x="420" y="318" fill="#f0f3f7" font-size="25" font-weight="700">Continuous list</text><text x="420" y="353.0" fill="#afbbc9" font-size="18" font-weight="400">Focused entry + scroll position</text><rect x="820" y="280" width="365" height="108" rx="14" fill="#202a37" stroke="#425063" stroke-width="1"/><text x="840" y="318" fill="#f0f3f7" font-size="25" font-weight="700">Entry actions</text><text x="840" y="353.0" fill="#afbbc9" font-size="18" font-weight="400">Preview · Use · Options</text><rect x="820" y="110" width="365" height="108" rx="14" fill="#202a37" stroke="#425063" stroke-width="1"/><text x="840" y="148" fill="#f0f3f7" font-size="25" font-weight="700">Full-screen preview</text><text x="840" y="183.0" fill="#afbbc9" font-size="18" font-weight="400">Back restores Preview focus</text><rect x="820" y="485" width="365" height="108" rx="14" fill="#202a37" stroke="#425063" stroke-width="1"/><text x="840" y="523" fill="#f0f3f7" font-size="25" font-weight="700">Options / app settings</text><text x="840" y="558.0" fill="#afbbc9" font-size="18" font-weight="400">Back restores initiating action</text><path d="M305 315 H400" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="328" y="302" fill="#8fe0c6" font-size="18" font-weight="400">Open</text><path d="M400 370 H305" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="327" y="405" fill="#8fe0c6" font-size="18" font-weight="400">Back</text><path d="M710 315 H820" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="718" y="295" fill="#8fe0c6" font-size="18" font-weight="400">Right / OK</text><path d="M820 370 H710" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="716" y="406" fill="#8fe0c6" font-size="18" font-weight="400">Left / Back</text><path d="M900 280 V218" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="815" y="251" fill="#8fe0c6" font-size="18" font-weight="400">Preview</text><path d="M1100 218 V280" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="1115" y="253" fill="#8fe0c6" font-size="18" font-weight="400">Back</text><path d="M900 388 V485" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="813" y="451" fill="#8fe0c6" font-size="18" font-weight="400">Options</text><path d="M1100 485 V388" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="1115" y="451" fill="#8fe0c6" font-size="18" font-weight="400">Back</text><path d="M450 280 V215 H655 V280" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="195" fill="#8fe0c6" font-size="18" font-weight="400">Up / Down scrolls, never saves</text><text x="45" y="569" fill="#afbbc9" font-size="21" font-weight="400">Use saves through existing Undo. Browsing, Preview and Back do not silently change the choice.</text></g></svg>