<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650"><defs><linearGradient id="tank" x2="1" y2="1"><stop stop-color="#12495d"/><stop offset="1" stop-color="#102b39"/></linearGradient><linearGradient id="clock" x2="1" y2="1"><stop stop-color="#5b3b90"/><stop offset="1" stop-color="#252044"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8fe0c6" stroke-width="1.3"/></marker><clipPath id="rail"><rect x="58" y="158" width="428" height="650" rx="10"/></clipPath></defs><rect width="100%" height="100%" fill="#101722"/><g font-family="Arial, sans-serif"><text x="45" y="55" fill="#f0f3f7" font-size="30" font-weight="700">One direction through objects, one direction into actions</text><rect x="60" y="135" width="305" height="108" rx="14" fill="#202a37" stroke="#425063" stroke-width="1"/><text x="80" y="173" fill="#f0f3f7" font-size="25" font-weight="700">First entry</text><text x="80" y="208.0" fill="#afbbc9" font-size="18" font-weight="400">Up reaches header Back</text><rect x="60" y="300" width="305" height="108" rx="14" fill="#202a37" stroke="#425063" stroke-width="1"/><text x="80" y="338" fill="#f0f3f7" font-size="25" font-weight="700">Focused screensaver</text><text x="80" y="373.0" fill="#afbbc9" font-size="18" font-weight="400">Up / Down moves one row</text><rect x="60" y="465" width="305" height="108" rx="14" fill="#202a37" stroke="#425063" stroke-width="1"/><text x="80" y="503" fill="#f0f3f7" font-size="25" font-weight="700">Last entry</text><text x="80" y="538.0" fill="#afbbc9" font-size="18" font-weight="400">Down stays; no wrap</text><rect x="650" y="300" width="420" height="108" rx="14" fill="#202a37" stroke="#425063" stroke-width="1"/><text x="670" y="338" fill="#f0f3f7" font-size="25" font-weight="700">Action area</text><text x="670" y="373.0" fill="#afbbc9" font-size="18" font-weight="400">Left / Back returns to the same row</text><path d="M212 243 V300" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="230" y="277" fill="#8fe0c6" font-size="18" font-weight="400">↓</text><path d="M180 300 V243" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="150" y="277" fill="#8fe0c6" font-size="18" font-weight="400">↑</text><path d="M212 408 V465" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="230" y="444" fill="#8fe0c6" font-size="18" font-weight="400">↓</text><path d="M180 465 V408" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="150" y="444" fill="#8fe0c6" font-size="18" font-weight="400">↑</text><path d="M365 330 H650" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="313" fill="#8fe0c6" font-size="18" font-weight="400">Right / OK</text><path d="M650 375 H365" fill="none" stroke="#8fe0c6" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="410" fill="#8fe0c6" font-size="18" font-weight="400">Left / Back</text><text x="650" y="181" fill="#8fe0c6" font-size="29" font-weight="700">No Previous or Next stop.</text><text x="650" y="219" fill="#afbbc9" font-size="23" font-weight="400">The list scrolls as focus moves.</text><text x="650" y="506" fill="#8fe0c6" font-size="28" font-weight="700">Focus ≠ saved selection</text><text x="650" y="546" fill="#afbbc9" font-size="23" font-weight="400">The saved choice carries its own badge.</text></g></svg>