  out+=B(cx-d/2,cy-d/2,d,d,`border-radius:50%;background:#1d2531;border:${P(3)} solid #4a5568`);
  const arm=(x,y,label,sel,w)=>B(x-w/2,y-34,w,68,`border-radius:${P(34)};display:grid;place-items:center;text-align:center;${F(22)};background:${sel?'#e9eef6':'#2c3646'};color:${sel?'#0d1521':'#e6edf7'};border:${P(2)} solid ${sel?'#e9eef6':'#56627a'}`,label);
  out+=arm(cx,cy-270,m.arms[0],m.sel===0,300)+arm(cx+252,cy,m.arms[1],m.sel===1,236)+arm(cx,cy+270,m.arms[2],m.sel===2,300)+arm(cx-252,cy,m.arms[3],m.sel===3,236);
  out+=B(cx-130,cy-130,260,260,`border-radius:50%;background:#263142;border:${P(2)} solid #56627a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:${P(6)}`,
    `<div style="${F(24)};font-weight:700;line-height:1.2">${m.title}</div><div style="${F(15)};color:#c3ccd9;line-height:1.25;padding:0 ${P(26)}">${m.sub}</div><div style="${F(18)};border:${P(2)} solid #9fb0c8;border-radius:${P(18)};padding:${P(3)} ${P(16)}">${m.center}</div>`);
  out+=B(cx-420,cy+d/2-6,840,30,`${F(17)};color:#c3ccd9;text-align:center`,m.hint);
  return out;
}

function sheet(panels,s){ // 2x2 thumbnails with one-line captions
  const w=1440*s,h=810*s,xs=[(1440-2*w-40)/2,(1440-2*w-40)/2+w+40],ys=[84,84+h+48];

}
