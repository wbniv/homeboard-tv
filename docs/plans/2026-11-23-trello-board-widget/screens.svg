<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<rect width="1600" height="1050" fill="#101827"/><g font-family="sans-serif" fill="#f4f7fc"><text x="55" y="55" font-size="30" font-weight="700">Trello · proposed TV and phone screens</text><text x="55" y="83" font-size="17" fill="#aebdd0">Illustrative data · focus shown in cyan · all visible text adapts to available space</text>
<text x="55" y="130" font-size="21" font-weight="700">1  Home · glance and entry</text><rect x="55" y="150" width="700" height="330" rx="18" fill="#253247"/><text x="82" y="189" font-size="19" fill="#b5c5d9">HOME                                      18:42</text><rect x="80" y="210" width="285" height="105" rx="12" fill="#344760"/><text x="102" y="246" font-size="20">Rain</text><text x="102" y="282" font-size="26">Light rain at 20:00</text><rect x="385" y="205" width="338" height="223" rx="14" fill="#1b2b41" stroke="#75dcff" stroke-width="5"/><text x="408" y="241" font-size="23" font-weight="700">Product board</text><text x="408" y="267" font-size="15" fill="#adc2d7">Updated 2 min ago</text><text x="408" y="299" font-size="17" fill="#b9cbdd">Now 3   ·   Next 4   ·   Review 1</text><line x1="408" y1="313" x2="699" y2="313" stroke="#61738a"/><text x="408" y="343" font-size="19">Improve onboarding</text><text x="408" y="374" font-size="19">Fix search</text><text x="408" y="408" font-size="15" fill="#adc2d7">+1 in Now       OK  View board</text><text x="80" y="455" font-size="15" fill="#adc2d7">Hold OK for widget actions</text>
<text x="800" y="130" font-size="21" font-weight="700">2  Full screen · navigate the board</text><rect x="800" y="150" width="745" height="480" rx="18" fill="#202d41"/><text x="825" y="191" font-size="25" font-weight="700">Product board</text><text x="825" y="218" font-size="14" fill="#b5c5d9">Updated 2 min ago  ·  Back returns to dashboard</text><rect x="1325" y="172" width="90" height="35" rx="8" fill="#344760"/><text x="1342" y="195" font-size="15">Refresh</text><rect x="1425" y="172" width="96" height="35" rx="8" fill="#344760"/><text x="1436" y="195" font-size="14">Restore</text><line x1="825" y1="233" x2="1520" y2="233" stroke="#61738a"/><text x="825" y="265" font-size="18" font-weight="700">NOW · 3</text><text x="1010" y="265" font-size="18" font-weight="700">NEXT · 4</text><text x="1204" y="265" font-size="18" font-weight="700">CARD DETAILS</text><rect x="821" y="280" width="170" height="67" rx="9" fill="#38506a" stroke="#75dcff" stroke-width="4"/><text x="834" y="308" font-size="16">Improve</text><text x="834" y="331" font-size="16">onboarding</text><rect x="821" y="359" width="170" height="55" rx="8" fill="#34445a"/><text x="834" y="393" font-size="16">Fix search</text><rect x="821" y="425" width="170" height="55" rx="8" fill="#34445a"/><text x="834" y="459" font-size="16">Add tests</text><rect x="1008" y="280" width="170" height="55" rx="8" fill="#34445a"/><text x="1020" y="313" font-size="16">Add reporting</text><rect x="1008" y="346" width="170" height="55" rx="8" fill="#34445a"/><text x="1020" y="379" font-size="16">Polish settings</text><text x="1020" y="440" font-size="15" fill="#b5c5d9">2 more ↓</text><text x="1204" y="304" font-size="20" font-weight="700">Improve onboarding</text><text x="1204" y="335" font-size="16">Make the first-run steps clearer</text><text x="1204" y="359" font-size="16">for new team members.</text><text x="1204" y="400" font-size="16">Due Nov 28  ·  Checklist 2/5</text><text x="1204" y="429" font-size="16">Labels: Design  ·  Member: Alex</text><text x="1204" y="469" font-size="15" fill="#b5c5d9">OK  Read complete details</text><text x="825" y="593" font-size="15" fill="#b5c5d9">← → Lists    ↑ ↓ Cards    More lists →</text>
<text x="55" y="540" font-size="21" font-weight="700">3  Connection and board selection · phone</text><rect x="55" y="560" width="345" height="440" rx="26" fill="#f2f5fa"/><g fill="#202b3c"><text x="80" y="606" font-size="23" font-weight="700">Connect Trello</text><text x="80" y="639" font-size="16">Choose what appears on your TV.</text><rect x="80" y="662" width="295" height="50" rx="9" fill="#255d9e"/><text x="143" y="693" font-size="17" fill="white">Connect securely</text><text x="80" y="748" font-size="16" font-weight="700">Board</text><rect x="80" y="762" width="295" height="49" rx="8" fill="white" stroke="#7d8ba1"/><text x="95" y="793" font-size="17">Product board                      ▾</text><text x="80" y="850" font-size="15">The selected board will be visible</text><text x="80" y="873" font-size="15">to people in the room.</text><rect x="80" y="906" width="295" height="48" rx="9" fill="#255d9e"/><text x="137" y="937" font-size="17" fill="white">Review and save</text></g>
<text x="450" y="540" font-size="21" font-weight="700">4  Offline · preserve context</text><rect x="450" y="560" width="305" height="210" rx="14" fill="#1b2b41" stroke="#75dcff" stroke-width="4"/><text x="472" y="598" font-size="22" font-weight="700">Product board</text><text x="472" y="629" font-size="15" fill="#ffce78">Couldn't refresh · last updated 2h ago</text><text x="472" y="667" font-size="18">Now 3  ·  Next 4  ·  Review 1</text><text x="472" y="701" font-size="17">Improve onboarding</text><text x="472" y="743" font-size="15" fill="#b5c5d9">OK  View board and retry</text><text x="450" y="817" font-size="16" fill="#b5c5d9">Connection lost: offer reconnect on phone.</text><text x="450" y="845" font-size="16" fill="#b5c5d9">Never describe a failed load as an empty board.</text></g></svg>
