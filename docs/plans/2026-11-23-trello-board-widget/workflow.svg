ext><text x="1100" y="425" fill="#5b7188">Last good snapshot + age</text><text x="570" y="401">Reconnect / Retry</text><text x="570" y="425" fill="#5b7188">No false empty state</text></g><g stroke="#7891aa" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M230 152H280"/><path d="M500 152H550"/><path d="M770 152H820"/><path d="M1030 152H1080"/><path d="M1205 189V302H770"/><path d="M550 302H500"/><path d="M770 302H820"/><path d="M925 265V220H1205V189"/><path d="M1205 189V370"/><path d="M1080 407H770"/><path d="M660 370V339"/></g><g font-size="14" fill="#536c84"><text x="1050" y="291">short OK</text><text x="792" y="290">Back / Restore</text><text x="1025" y="397">failure</text></g><text x="40" y="248" font-size="17" font-weight="700" fill="#5b7188">REPEAT USE · REMOTE</text><text x="40" y="484" font-size="15" fill="#536c84">The board remains read-only. Reconnect may require phone authorization; no credentials are included in the widget draft.</text></g></svg>
