<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Full-screen air quality: nearby station measurements on a map</title>
<desc id="desc">A schematic geographic-map composition shows a blue actual-location marker and accuracy circle, nearby station measurement markers and a selected-station panel. Controls include radius, recenter, pan, zoom and map/history tabs. Coordinates, streets, distances and values in this mockup are illustrative; implementation uses real station coordinates and a geographic basemap.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#eef5f7}.head{font-size:25px;font-weight:bold}.body{font-size:18px}.small{font-size:15px;fill:#bad0d7}.button{fill:#2b5362;stroke:#acd1dd;stroke-width:1.5}.road{stroke:#536b70;stroke-width:12;fill:none}.roadline{stroke:#adbbb1;stroke-width:2;fill:none}.water{fill:none;stroke:#234f67;stroke-width:44}.marker{stroke:#102a35;stroke-width:3}</style></defs>
<rect width="1200" height="820" fill="#102a35"/>
<text x="24" y="39" class="head">Air quality · Nearby stations and your actual location</text>
<rect x="24" y="56" width="215" height="40" rx="8" class="button"/><text x="38" y="82" class="body">← Restore dashboard</text>
<rect x="256" y="56" width="164" height="40" rx="8" class="button"/><text x="281" y="82" class="body">Nearby map</text>
<rect x="436" y="56" width="124" height="40" rx="8" class="button"/><text x="459" y="82" class="body">History</text>
<text x="589" y="82" class="small">History: 24 hours / 7 days / 30 days</text>
<text x="24" y="124" class="small">Illustrative layout only · Real station coordinates and geographic basemap required in implementation</text>

