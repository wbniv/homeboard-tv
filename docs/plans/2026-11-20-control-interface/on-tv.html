<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>What a remote command shows on the TV · Homeboard design</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0d1521;color:#eef2fa;font:21px/1.4 system-ui,sans-serif}
main{width:1440px;height:900px;padding:30px 40px;overflow:hidden;position:relative}
h1{font-size:31px;line-height:1.2;margin:0 0 14px}
.kicker{color:#9ad7ff;font-size:15px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
figure{margin:0}
figcaption{font-size:17px;color:#b9c7dc;margin:6px 2px 0;line-height:1.3}
figcaption b{color:#9ad7ff;font-weight:600}
.tv{position:relative;height:300px;border-radius:12px;border:1px solid #46566c;background:#111827;overflow:hidden;cursor:pointer}
.tile{position:absolute;background:#2c405a;border-radius:10px;border:1px solid #46566c;padding:8px 12px;font-size:15px;line-height:1.3;color:#dfe8f5}
.tile big{display:block;font-size:26px;line-height:1.1;margin-top:2px}
.tile.focus{border:3px solid #b9dcff}
.foot{position:absolute;left:18px;bottom:8px;font-size:12px;color:#b9c7dc}
.banner{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;width:460px;background:#22324a;border:2px solid #9ad7ff;border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.3}
.banner .who{width:30px;height:30px;border-radius:8px;background:#3b4f6b;display:grid;place-items:center;font-size:16px;flex:none}
.banner div{flex:1}
.banner small{display:block;font-size:12px;color:#b9c7dc}
.banner .undo{font-weight:700;border:1px solid #6f86a6;border-radius:6px;padding:4px 10px}
.banner.warn{border-color:#e0b24a}
.banner.quiet{border-color:#6f86a6}
.moving{outline:3px dashed #e0b24a;outline-offset:3px}
.page{position:absolute;right:16px;top:10px;font-size:12px;color:#b9c7dc}
footer{position:absolute;left:40px;right:40px;bottom:14px;font-size:17px;color:#b9c7dc}
</style>
<main>
<div class="kicker">Homeboard · proposed design · Home at reduced scale, four outcomes</div>
<h1>What a command from another device shows on the TV</h1>
<div class="grid">
<figure><div class="tv" data-note="Navigation is not a saved change, so there is no Undo. Back and Left work as usual. The notice fades after 5 s and never takes focus.">
<span class="page">Home 2/3</span>
<div class="tile focus" style="left:18px;top:34px;width:300px;height:118px">Front door<big>Camera</big>Android widget</div>
<div class="tile" style="left:330px;top:34px;width:300px;height:118px">Timers &amp; alarms<big>Rice · 6:12</big>1 running</div>
<div class="banner quiet"><span class="who">⌂</span><div><b>Home Assistant</b> showed Home page 2<small>From the “Doorbell” automation</small></div></div>
<span class="foot">Home 2/3 · Right → All Apps</span></div>
<figcaption><b>1 · Show a page.</b> Homeboard comes to the front if another app was playing (decision 1), shows page 2 and names who asked.</figcaption></figure>
<figure><div class="tv" data-note="Timer actions are immediate and have no Undo, the same as timers from the phone. The timer itself is the visible result; the notice names who started it.">
<span class="page">Home 1/3</span>
<div class="tile" style="left:18px;top:34px;width:300px;height:118px">BANGKOK · Benchasiri Park<big>PM2.5 25.9</big>µg/m³ · 19:00</div>
<div class="tile focus" style="left:330px;top:34px;width:300px;height:118px">Timers &amp; alarms<big>Rice · 10:00</big>started just now</div>
<div class="banner quiet"><span class="who">›_</span><div><b>Kitchen script</b> started “Rice” · 10:00<small>Stop it from the timer, as usual</small></div></div>
<span class="foot">Home 1/3 · Hold OK → menu</span></div>
<figcaption><b>2 · Start a timer.</b> Nothing moves and focus stays where it was. When another app is in front, nothing is drawn; the timer and All activity show it later.</figcaption></figure>
<figure><div class="tv" data-note="A setting chosen remotely is a saved change: it goes into Undo history with the device's name, and hold Back on Home undoes it like any other change.">
<span class="page">Home 1/3</span>
<div class="tile focus" style="left:18px;top:34px;width:300px;height:118px">BANGKOK · Benchasiri Park<big>PM2.5 25.9</big>µg/m³ · 19:00</div>
<div class="tile" style="left:330px;top:34px;width:300px;height:118px">Calendar<big>Fri 20</big>2 events</div>
<div class="banner"><span class="who">◎</span><div><b>Screensaver: Clock</b> · from Google Home<small>Hold Back for 1 second to undo</small></div><span class="undo">Undo</span></div>
<span class="foot">Home 1/3 · Hold OK → menu</span></div>
<figcaption><b>3 · Choose a setting.</b> The usual Undo banner, labelled with the device. Undo history lists it as “Screensaver: Clock · Google Home”.</figcaption></figure>
<figure><div class="tv" data-note="The person is moving a widget. A command that would change the screen is refused, so their move is never lost; the device is told “busy” and may retry.">
<span class="page">Home 1/3</span>
<div class="tile moving" style="left:18px;top:34px;width:300px;height:118px">Calendar<big>Moving…</big>arrows move · OK places</div>
<div class="tile" style="left:330px;top:34px;width:300px;height:118px">Timers &amp; alarms<big>No timers</big></div>
<div class="banner warn"><span class="who">⌂</span><div><b>Home Assistant</b> wanted to show Home page 2<small>Not shown while you are moving a widget</small></div></div>
<span class="foot">Moving Calendar</span></div>
<figcaption><b>4 · Busy.</b> A command that would change the screen is refused, and the TV says so. Timer commands still run.</figcaption></figure>
</div>
<footer id="feedback">Every notice uses the Undo banner's place at the bottom of the screen, so there is one place to look. Click a frame for its rule.</footer>
</main>
<script>document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>feedback.textContent=b.dataset.note);</script>
</html>
