<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Three distinct triggers: need, review schedule and review after purchase</title>
<desc id="desc">Reported low stock can suggest a shopping need in Phase 2. A future calendar schedule can request a stock review. A future purchase event can schedule the next review after a chosen interval. A reminder never changes inventory.</desc>
<rect width="1200" height="420" fill="#0d1c25"/>
<g font-family="Arial,sans-serif" fill="#edf4f5">
<text x="30" y="42" font-size="25">Remember The Milk lesson: make the repeat trigger explicit</text>
<g fill="#223e49" stroke="#54727f" stroke-width="2"><rect x="30" y="80" width="355" height="240" rx="14"/><rect x="422" y="80" width="355" height="240" rx="14"/><rect x="814" y="80" width="356" height="240" rx="14"/></g>
<text x="50" y="117" font-size="17" fill="#8be0be">PHASE 2 · STOCK-BASED</text><text x="50" y="159" font-size="23">Reported stock is low</text><text x="50" y="197" font-size="18">Suggest an explained amount</text><text x="50" y="232" font-size="18">Person reviews → Add to list</text><text x="50" y="285" font-size="16" fill="#b8cbd0">One current need; staple remains</text>
<text x="442" y="117" font-size="17" fill="#b8cbd0">LATER · CALENDAR-BASED</text><text x="442" y="159" font-size="23">Every Sunday</text><text x="442" y="197" font-size="18">Ask someone to check stock</text><text x="442" y="232" font-size="18">Their report informs the need</text><text x="442" y="285" font-size="16" fill="#b8cbd0">Reminder ≠ depleted inventory</text>
<text x="834" y="117" font-size="17" fill="#b8cbd0">AFTER PHASE 3 · EVENT-BASED</text><text x="834" y="159" font-size="23">7 days after purchase</text><text x="834" y="197" font-size="18">Schedule the next stock review</text><text x="834" y="232" font-size="18">Anchor to a real purchase event</text><text x="834" y="285" font-size="16" fill="#b8cbd0">Reminder ≠ another purchase</text>
<text x="30" y="368" font-size="20" fill="#8be0be">Persistent product · Current shopping need · Review reminder · Purchase event</text>
<text x="30" y="402" font-size="18" fill="#b8cbd0">Separate records and explicit actions prevent duplicate needs and invented stock changes.</text>
</g></svg>
