<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1680" viewBox="0 0 1440 1680" role="img" aria-labelledby="title desc"><title id="title">Grocery widget: Phase 1 and Phase 2 screen designs</title><desc id="desc">Two phases, each with a phone entry screen, compact TV widget and richer full-screen detail. Phase 1 has free-text entry and reusable staples. Phase 2 has confirmed product units and stock-aware replenishment. These designs deliberately contain no purchase checkboxes.</desc><style>text{font-family:Arial,sans-serif;fill:#edf4f5} .muted{fill:#b8cbd0} .accent{fill:#8be0be}</style><rect width="100%" height="100%" fill="#0d1c25"/>
<text x="32" y="44" font-size="27" fill="#edf4f5">GROCERIES / PHONE FIRST</text>
<text x="32" y="77" font-size="18" fill="#b8cbd0" style="fill:#b8cbd0">Design proposal · Sample data · Purchase check-off and remote sync arrive in Phase 3</text>
<rect x="24" y="102" width="1392" height="741" rx="14" fill="#122631" stroke="none" stroke-width="2"/>
<text x="46" y="139" font-size="27" fill="#edf4f5">01  Add what you need</text>
<text x="46" y="168" font-size="18" fill="#b8cbd0" style="fill:#b8cbd0">Basic list entry + reusable staples. Phone edits stay in a draft until Update TV.</text>
