<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Proposed grocery tasks: capture, review staples and refine an amount</title><desc id="desc">Three phone wireframes put quick entry first, simple staple status second, and product units in contextual details. These are proposed changes, not current screens.</desc><rect width="1200" height="650" fill="#10212b"/><g font-family="Arial,sans-serif" fill="#ecf3f5"><text x="26" y="40" font-size="25">Grocery review · goals before administration · proposed screens</text>
