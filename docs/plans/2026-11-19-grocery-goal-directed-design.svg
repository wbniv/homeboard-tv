<text x="44" y="155" font-size="17">Groceries · Cast1</text>
<text x="44" y="194" font-size="17">Add an item…          Add</text>
<text x="44" y="233" font-size="17">Milk · 2 cartons</text>
<text x="44" y="272" font-size="17">Eggs · 6</text>
<text x="44" y="311" font-size="17">Limes · a few</text>
<text x="44" y="350" font-size="17"></text>
<text x="44" y="389" font-size="17">Check staples    Add several</text>
<text x="44" y="428" font-size="17"></text>
<text x="44" y="467" font-size="17">Added Eggs · Not on TV yet</text>
<text x="44" y="506" font-size="17">Undo</text>
<rect x="38" y="520" width="340" height="35" rx="6" fill="#385c58"/>
<text x="44" y="545" font-size="17">Update Cast1</text>
<rect x="418" y="76" width="364" height="538" rx="18" fill="#203944" stroke="#65818e"/><text x="436" y="114" font-size="23">2 · Check staples</text>
<text x="436" y="155" font-size="17">Need more   Not sure   All</text>
<text x="436" y="194" font-size="17">Oat milk</text>
<text x="436" y="233" font-size="17">Enough / Need more / Not sure</text>
<text x="436" y="272" font-size="17"></text>
<text x="436" y="311" font-size="17">Reported 0.5 L · Today, 09:10</text>
<text x="436" y="350" font-size="17">Low at 1 L · Target 3 L</text>
