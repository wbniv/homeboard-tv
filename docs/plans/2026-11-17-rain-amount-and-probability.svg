<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Rain: amount bars and aligned probability strip</title>
<desc id="desc">An illustrative hourly chart uses bar height for forecast millimeters. A separate row of percentage meters underneath shows precipitation probability for the same intervals. Highlighting 14:00–15:00 shows 70 percent chance and 2.5 millimeters forecast. A low-chance, larger-amount bar stays visible at full height.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#eef6f7}.title{font-size:25px;font-weight:bold}.body{font-size:19px}.small{font-size:16px;fill:#bdd3da}.grid{stroke:#48616e;stroke-width:1}.button{fill:#294e5e;stroke:#accdd8}.bar{fill:#73c5df}.meter{fill:#b9a3ed}.base{fill:#344655}</style></defs>
<rect width="1200" height="760" fill="#102a35"/>
<text x="28" y="40" class="title">Rain · Forecast amount and probability in one aligned view</text>
<rect x="28" y="59" width="218" height="41" rx="8" class="button"/><text x="42" y="86" class="body">← Restore dashboard</text>
<text x="278" y="86" class="body">24 hours / 48 hours / 7 days / All available</text>
<text x="28" y="128" class="small">Illustrative forecast · 17 Nov 2026 · Asia/Bangkok · All columns represent one-hour intervals</text>
<rect x="28" y="148" width="755" height="459" rx="12" fill="#173947"/>
<text x="44" y="181" class="body">Forecast rain amount · mm during the hour</text>
<path d="M97 220H754M97 265H754M97 310H754M97 355H754M97 400H754" class="grid"/>
<text x="64" y="226" class="small">8</text><text x="64" y="271" class="small">6</text><text x="64" y="316" class="small">4</text><text x="64" y="361" class="small">2</text><text x="64" y="406" class="small">0</text>
<rect x="117" y="395.5" width="70" height="4.5" class="bar"/>
<rect x="227" y="377.5" width="70" height="22.5" class="bar"/>
<rect x="337" y="343.75" width="70" height="56.25" class="bar"/>
<rect x="447" y="220" width="70" height="180" class="bar"/>
<rect x="557" y="287.5" width="70" height="112.5" class="bar"/>
<rect x="667" y="388.75" width="70" height="11.25" class="bar"/>
<rect x="326" y="207" width="92" height="327" rx="9" fill="none" stroke="#fff" stroke-width="3"/>
<text x="120" y="427" class="small">12–13</text><text x="230" y="427" class="small">13–14</text><text x="340" y="427" class="small">14–15</text><text x="450" y="427" class="small">15–16</text><text x="560" y="427" class="small">16–17</text><text x="670" y="427" class="small">17–18</text>
<text x="44" y="464" class="body">Chance · 0–100% for the same hourly intervals</text>
<g class="base"><rect x="117" y="480" width="70" height="14" rx="4"/><rect x="227" y="480" width="70" height="14" rx="4"/><rect x="337" y="480" width="70" height="14" rx="4"/><rect x="447" y="480" width="70" height="14" rx="4"/><rect x="557" y="480" width="70" height="14" rx="4"/><rect x="667" y="480" width="70" height="14" rx="4"/></g>
<g class="meter"><rect x="117" y="480" width="63" height="14" rx="4"/><rect x="227" y="480" width="28" height="14" rx="4"/><rect x="337" y="480" width="49" height="14" rx="4"/><rect x="447" y="480" width="14" height="14" rx="4"/><rect x="557" y="480" width="63" height="14" rx="4"/><rect x="667" y="480" width="35" height="14" rx="4"/></g>
<text x="133" y="521" class="body">90%</text><text x="243" y="521" class="body">40%</text><text x="353" y="521" class="body">70%</text><text x="463" y="521" class="body">20%</text><text x="573" y="521" class="body">90%</text><text x="683" y="521" class="body">50%</text>
<text x="44" y="566" class="small">Low-chance 8 mm forecast at 15–16 retains its full bar height and contrast.</text>

<rect x="806" y="148" width="366" height="459" rx="12" fill="#21434f"/>
<text x="825" y="182" class="small">Highlighted hour · Updated on focus</text>
<text x="825" y="227" class="title">14:00–15:00</text>
<text x="825" y="261" class="body">17 Nov 2026 · Bangkok</text>
<text x="825" y="316" font-size="34">70% chance</text>
<text x="825" y="372" font-size="34">2.5 mm forecast</text>
<text x="825" y="414" class="small">Precipitation probability</text>
<text x="825" y="440" class="small">Liquid-rain amount for this interval</text>
<rect x="825" y="470" width="328" height="43" rx="8" class="button"/><text x="842" y="499" class="body">Open interval / day details</text>
<text x="825" y="552" class="small">Amount and probability stay separate.</text>
<text x="825" y="580" class="small">Source · Update time · Data coverage</text>

<text x="28" y="650" class="body">Daily summary format: total mm · peak hourly chance · wettest labeled period</text>
<text x="28" y="685" class="small">Chance is not multiplied into rainfall amount · Missing values stay gaps · Location and units retain saved choices</text>
<text x="28" y="731" class="body">Arrows → Highlight hour · OK → More detail · Back → Restore dashboard</text>
</svg>
