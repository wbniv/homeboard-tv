<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350"><defs><linearGradient id="w"><stop stop-color="#267d8e"/><stop offset="1" stop-color="#759b45"/></linearGradient></defs><rect width="1000" height="350" fill="#101a23"/><g font-family="sans-serif" fill="white"><text x="25" y="35" font-size="23">Widget background opacity · wallpaper brightness stays the same</text><g fill="url(#w)"><rect x="25" y="65" width="300" height="230"/><rect x="350" y="65" width="300" height="230"/><rect x="675" y="65" width="300" height="230"/></g><g fill="#172430"><rect x="45" y="90" width="260" height="160" fill-opacity="0" stroke="white"/><rect x="370" y="90" width="260" height="160" fill-opacity=".75" stroke="white"/><rect x="695" y="90" width="260" height="160" stroke="white"/></g><g font-size="19"><text x="60" y="130">Rain · 24 hours</text><text x="385" y="130">Rain · 24 hours</text><text x="710" y="130">Rain · 24 hours</text><text x="150" y="280">0%</text><text x="465" y="280">75%</text><text x="790" y="280">100%</text></g><text x="25" y="330" font-size="17">Only the card fill changes. Text, artwork and focus borders remain visible.</text></g></svg>
