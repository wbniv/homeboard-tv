<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Full-screen Favorites: banners and highlighted-app details</title>
<desc id="desc">A four-column by four-row banner grid occupies the left side. The right panel immediately follows the highlighted app, showing full name, version, update date and Open, App info, Remove from favorites and Reorder actions. App names and metadata are illustrative.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#eef5f7}.head{font-size:26px;font-weight:bold}.body{font-size:19px}.small{font-size:16px;fill:#b7cdd3}.button{fill:#2a5260;stroke:#a7d5df;stroke-width:1.5}.banner{fill:#244654;stroke:#638b98}.name{font-size:19px}</style>
