<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410"><rect width="1200" height="410" fill="#101a23"/><g font-family="sans-serif" fill="#f2f5f8"><text x="30" y="40" font-size="26">Undo from the TV remote</text><g fill="#253440" stroke="#8ccfb9"><rect x="30" y="85" width="350" height="270" rx="12"/><rect x="425" y="85" width="350" height="270" rx="12"/><rect x="820" y="85" width="350" height="270" rx="12"/></g><g font-size="18"><text x="50" y="120">Saved change</text><text x="50" y="185">Moved Rain</text><text x="50" y="220">Hold Back to undo</text><rect x="245" y="265" width="110" height="55" rx="8" fill="#354d5f" stroke="#8ccfb9"/><text x="270" y="300">Undo</text><text x="445" y="120">Hold for one second</text><text x="445" y="185">Undo: Moved Rain</text><text x="445" y="220">Keep holding Back…</text><rect x="445" y="270" width="310" height="10" fill="#15232e"/><rect x="445" y="270" width="200" height="10" fill="#8ccfb9"/><text x="840" y="120">Done</text><text x="840" y="185">Undid Moved Rain</text><text x="840" y="220">Release leaves you here.</text><text x="840" y="250">Fresh hold undoes one more.</text><text x="394" y="220">→</text><text x="789" y="220">→</text></g><text x="30" y="390" font-size="17">Short Back navigates normally. Menus and editors keep Back for cancel/close.</text></g></svg>
