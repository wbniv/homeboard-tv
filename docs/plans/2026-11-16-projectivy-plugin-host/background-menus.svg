<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>text{font-family:DejaVu Sans,sans-serif;fill:#ecf5ed}.h{font-size:24px;font-weight:bold}.b{font-size:18px}.s{font-size:15px;fill:#c4d6cb}</style><rect width="1200" height="520" fill="#10251c"/><text x="24" y="36" class="h">Background actions have concrete destinations</text><g transform="translate(24 65)"><rect width="360" height="420" rx="18" fill="#294436"/><text x="20" y="38" class="h">Background</text><text x="20" y="95" class="b">↑ Solid color → color picker</text><text x="20" y="150" class="b">→ Projectivy plugins → setup</text><text x="20" y="205" class="b">↓ Background details</text><text x="20" y="260" class="b">← Retry selected provider</text><text x="20" y="305" class="s">Retry shown for providers only.</text><text x="20" y="382" class="s">Back → Appearance</text></g><g transform="translate(420 65)"><rect width="360" height="420" rx="18" fill="#294436"/><text x="20" y="38" class="h">Palette</text><rect x="20" y="70" width="150" height="85" rx="10" fill="#101625"/><text x="38" y="120" class="b">Midnight</text><rect x="185" y="70" width="150" height="85" rx="10" fill="#163b29" stroke="#fff" stroke-width="3"/><text x="205" y="120" class="b">Forest</text><rect x="20" y="175" width="150" height="85" rx="10" fill="#16416e"/><text x="40" y="225" class="b">Ocean</text><rect x="185" y="175" width="150" height="85" rx="10" fill="#51334d"/><text x="205" y="225" class="b">Plum</text><text x="20" y="305" class="s">Move → preview solid color.</text><text x="20" y="340" class="s">One Undo for source + color.</text><text x="20" y="382" class="s">Back / OK → invoking screen</text></g><g transform="translate(816 65)"><rect width="360" height="420" rx="18" fill="#294436"/><text x="20" y="38" class="h">Background details</text><text x="20" y="90" class="b">Source: Solid color</text><text x="20" y="130" class="b">Palette: Forest</text><text x="20" y="170" class="b">UI background opacity: 75%</text><text x="20" y="220" class="s">Provider: status / title / credits</text><rect x="20" y="270" width="320" height="45" rx="8" fill="#46604d"/><text x="42" y="300" class="b">Choose color</text><rect x="20" y="328" width="320" height="45" rx="8" fill="#46604d"/><text x="42" y="358" class="b">Choose provider</text><text x="20" y="400" class="s">Back → Background</text></g></svg>
