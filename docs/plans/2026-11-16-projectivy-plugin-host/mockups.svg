<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1020" viewBox="0 0 1120 1020"><style>text{font-family:DejaVu Sans,sans-serif;fill:#eef3fc} .heading{font-size:25px;font-weight:bold}.body{font-size:18px}.small{font-size:15px;fill:#becbe0}.focus{fill:#243d5c;stroke:#87c7ff;stroke-width:3}.panel{fill:#142339;stroke:#405670;stroke-width:1}.button{fill:#2a405c}</style><rect width="1120" height="1020" fill="#091321"/>
