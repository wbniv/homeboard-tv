<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
<style>text{font-family:DejaVu Sans,sans-serif;fill:#fff}.h{font-size:26px;font-weight:bold}.b{font-size:18px}.s{font-size:15px;fill:#e4edf5}</style>
<rect width="1200" height="580" fill="#101b2b"/><text x="28" y="40" class="h">UI opacity changes colored backgrounds only</text>
<text x="28" y="72" class="b">Text, app artwork, readings and focus indicators stay opaque at every level.</text>
<defs><g id="scene"><rect width="360" height="320" fill="#8d9cbe"/><path d="M0 160 L90 50 L180 200 L270 90 L360 240 V320 H0Z" fill="#457d76"/></g><g id="content"><rect x="25" y="35" width="310" height="125" rx="14" fill="none" stroke="#d0efdc"/><text x="45" y="75" class="b">Bangkok air quality</text><text x="45" y="115" class="h">PM2.5 24.5</text><circle cx="70" cy="220" r="26" fill="#f64a41"/><path d="M65 209 L65 231 L82 220Z" fill="white"/><text x="110" y="226" class="b">YouTube</text></g></defs>
<g transform="translate(28 110)"><use href="#scene"/><use href="#content"/><text y="355" class="h">0% · wallpaper revealed</text></g>
<g transform="translate(420 110)"><use href="#scene"/><rect width="360" height="320" fill="#142b23" fill-opacity=".75"/><rect x="25" y="35" width="310" height="125" rx="14" fill="#304e40" fill-opacity=".75"/><use href="#content"/><text y="355" class="h">75% · default blend</text></g>
<g transform="translate(812 110)"><use href="#scene"/><rect width="360" height="320" fill="#142b23"/><rect x="25" y="35" width="310" height="125" rx="14" fill="#304e40"/><use href="#content"/><text y="355" class="h">100% · wallpaper covered</text></g>
<rect x="28" y="493" width="1144" height="60" rx="12" fill="#33483e" fill-opacity=".95"/><text x="48" y="518" class="b">Appearance → UI opacity: ↑ +5% · → 100% · ↓ −5% · ← Reset 75% · OK Done · Back Cancel</text><text x="48" y="542" class="s">Pie backgrounds always 95%. Menu labels and icons stay opaque. Done saves one change with Undo.</text></svg>
