<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="830" viewBox="0 0 1180 830"><rect width="1180" height="830" fill="#102c27"/><g font-family="sans-serif" fill="#e4f3ff"><text x="32" y="45" font-size="26">Configure Calendar · one combined display</text><text x="32" y="78" font-size="16" fill="#acc3ba">All holiday sources share one day count. Flowers / Wan Phra keep calendar-week boundaries.</text><rect x="30" y="110" width="1120" height="590" rx="20" fill="#203e37"/><text x="56" y="153" font-size="20">All holidays · Number of days</text><text x="600" y="153" font-size="20">7 days / 30 days / Custom…</text><text x="56" y="214" font-size="20">Enabled holiday sources</text><text x="600" y="214" font-size="20">Thailand · Spain · USA · China</text><text x="56" y="275" font-size="20">Flower work</text><text x="600" y="275" font-size="20">This week + next week</text><text x="56" y="336" font-size="20">Wan Phra</text><text x="600" y="336" font-size="20">This week + next week</text><text x="56" y="397" font-size="20">Spanish scope</text><text x="600" y="397" font-size="18">Spain / Catalunya / Tarragona / Tivissa</text><text x="56" y="458" font-size="20">USA scope</text><text x="600" y="458" font-size="20">Federal</text><text x="56" y="519" font-size="20">China: show make-up working days</text><text x="600" y="519" font-size="20">Off</text><text x="56" y="580" font-size="20">Week starts</text><text x="600" y="580" font-size="20">Monday (fixed)</text><text x="56" y="670" font-size="16" fill="#acc3ba">TODO: make the week-start day changeable.</text><text x="32" y="744" font-size="18">Next N days includes today. Custom accepts a positive whole number.</text><text x="32" y="780" font-size="16" fill="#acc3ba">Only upcoming event dates appear. Incomplete coverage stays visible without shortening the range.</text><text x="32" y="814" font-size="14" fill="#acc3ba">Design illustration. Provider ingestion, combined display and source settings require implementation.</text></g></svg>