<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#101723"/><g font-family="sans-serif" fill="#edf3ff"><text x="48" y="48" font-size="23">Review an action</text><text x="48" y="78" font-size="16" fill="#aabbd0">Separate choices, separate consequences</text><rect x="48" y="130" width="565" height="310" rx="18" fill="#233146" stroke="#40536d" stroke-width="1"/><text x="70" y="170" font-size="23">Delete this tile?</text><text x="70" y="202" font-size="16" fill="#bacbdd">YouTube will remain installed.</text><text x="72" y="245" font-size="18">Dashboard: removes the favorite tile.</text><text x="72" y="280" font-size="18">All Apps: hides the tile from Homeboard.</text><text x="72" y="335" font-size="18">Restore it later through Homeboard settings.</text><text x="72" y="402" font-size="21">[ Cancel ]                      [ Delete tile ]</text><rect x="638" y="130" width="594" height="310" rx="18" fill="#233146" stroke="#40536d" stroke-width="1"/><text x="660" y="170" font-size="23">Uninstall YouTube?</text><text x="660" y="202" font-size="16" fill="#bacbdd">Homeboard opens Android’s uninstall confirmation.</text><text x="662" y="245" font-size="18">Android controls the final confirmation.</text><text x="662" y="280" font-size="18">Cancel keeps the app and its tiles.</text><text x="662" y="335" font-size="18">Remove tiles only after confirmed uninstall.</text><text x="662" y="402" font-size="21">[ Cancel ]              [ Continue to Android ]</text><text x="48" y="540" font-size="20">Move mode: arrows move a preview; OK saves; Back cancels.</text><text x="48" y="580" font-size="18" fill="#aabbd0">System apps may not offer uninstall. Do not silently substitute Disable.</text></g></svg>