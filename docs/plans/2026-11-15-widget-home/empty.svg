<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#101723"/><g font-family="sans-serif" fill="#edf3ff"><text x="48" y="48" font-size="23">Empty Home</text><text x="48" y="78" font-size="16" fill="#aabbd0">Diagram labels are explanatory and do not appear on the actual empty dashboard</text><rect x="48" y="115" width="1184" height="460" rx="20" fill="#121d2c" stroke="#40536d"/><text x="420" y="337" font-size="25" fill="#92a6bf">Background only — zero widgets</text><text x="48" y="625" font-size="19">Right opens All Apps even when there is nothing to focus.</text><text x="48" y="660" font-size="17" fill="#aabbd0">Hold OK on the empty background opens Home settings / Add widget.</text></g></svg>