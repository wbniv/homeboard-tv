<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Homeboard TV built-in-style app grid and visual settings</title>
  <desc id="desc">Full-size launcher icons and labels flow into as many columns as fit. A graphical Homeboard settings panel previews app artwork, circular icon mask, and About.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142438"/><stop offset="1" stop-color="#0a1019"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#263b54"/><stop offset="1" stop-color="#1a2a3e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".55"/></filter>
    <clipPath id="circle"><circle cx="0" cy="0" r="39"/></clipPath>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a8d3ff"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="66" y="80" fill="#f4f7fb" font-family="sans-serif" font-size="42" font-weight="700">All Apps</text>
  <text x="68" y="119" fill="#aebdd0" font-family="sans-serif" font-size="20">Launcher icons · full-size artwork and labels · columns fit the screen</text>
  <rect x="80" y="168" width="168" height="145" rx="20" fill="#74b7ff" fill-opacity=".13" stroke="#d6ecff" stroke-width="6"/>
  <rect x="298" y="168" width="168" height="145" rx="20" fill="none" stroke="#9acbff" stroke-width="3" stroke-opacity=".55"/>
  <path d="M239 326 C274 350 316 350 350 326" fill="none" stroke="#a8d3ff" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="255" y="371" text-anchor="middle" fill="#c8e2fb" font-family="sans-serif" font-size="14">SPRINGING FOCUS</text>
  <g transform="translate(1680 28)">
    <rect width="84" height="84" rx="42" fill="#263c56" stroke="#8abaff" stroke-width="2"/>
    <g stroke="#f4f7fb" stroke-width="4" stroke-linecap="round"><path d="M22 27h40M22 42h40M22 57h40"/></g>
    <g fill="#f4f7fb"><circle cx="34" cy="27" r="4"/><circle cx="52" cy="42" r="4"/><circle cx="29" cy="57" r="4"/></g>
    <text x="42" y="108" text-anchor="middle" fill="#b7cee9" font-family="sans-serif" font-size="14">Homeboard</text>
  </g>
  <g transform="translate(1800 28)">
    <rect width="84" height="84" rx="42" fill="#263c56" stroke="#8abaff" stroke-width="2"/>
    <text x="42" y="58" text-anchor="middle" fill="#f4f7fb" font-family="sans-serif" font-size="39">⚙</text>
    <text x="42" y="108" text-anchor="middle" fill="#b7cee9" font-family="sans-serif" font-size="14">Device</text>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#f5f7fc">
    <g transform="translate(74 185)">
      <g id="app-row" font-size="18">
        <g transform="translate(0 0)"><circle cx="72" cy="52" r="39" fill="#f2bc34"/><path d="M52 39h40v26H52z" fill="#fff"/><text x="72" y="119">YouTube</text></g>
        <g transform="translate(218 0)"><circle cx="72" cy="52" r="39" fill="#3988f4"/><path d="M61 31h23v43H61z" fill="#fff"/><text x="72" y="119">Play Store</text></g>
        <g transform="translate(436 0)"><circle cx="72" cy="52" r="39" fill="#63d39b"/><path d="M72 27 96 66H48z" fill="#fff"/><text x="72" y="119">Forest</text></g>
        <g transform="translate(654 0)"><circle cx="72" cy="52" r="39" fill="#e45b6c"/><path d="M54 43h36v24H54zM61 34v9m22-9v9" fill="none" stroke="#fff" stroke-width="5"/><text x="72" y="119">Calendar</text></g>
        <g transform="translate(872 0)"><circle cx="72" cy="52" r="39" fill="#e788d4"/><path d="M54 52q18-25 36 0-18 25-36 0" fill="#fff"/><text x="72" y="119">Photos</text></g>
        <g transform="translate(1090 0)"><circle cx="72" cy="52" r="39" fill="#4cbed0"/><path d="M57 36h30v32H57z" fill="#fff"/><text x="72" y="119">Language</text></g>
        <g transform="translate(1308 0)"><circle cx="72" cy="52" r="39" fill="#ee8d4d"/><path d="M51 48h42v22H51zm8-12h26v12H59z" fill="#fff"/><text x="72" y="119">Ticket to Ride</text></g>
        <g transform="translate(1526 0)"><circle cx="72" cy="52" r="39" fill="#8c9eb9"/><path d="M54 35h36v36H54z" fill="#fff"/><text x="72" y="119">Settings</text></g>
      </g>
      <use href="#app-row" y="165"/><use href="#app-row" y="330"/><use href="#app-row" y="495"/>
    </g>
  </g>
  <text x="76" y="1000" fill="#bbc9d9" font-family="sans-serif" font-size="19">One tile per app · four rows fit vertically · app columns and page size change with screen width</text>
  <rect width="1920" height="1080" fill="#07101c" opacity=".43"/>
  <g transform="translate(470 117)" filter="url(#shadow)">
    <rect width="980" height="930" rx="30" fill="url(#panel)" stroke="#90a9c6" stroke-width="2"/>
    <text x="48" y="66" fill="#fff" font-family="sans-serif" font-size="34" font-weight="700">Homeboard settings</text>
    <text x="50" y="103" fill="#b9cbe0" font-family="sans-serif" font-size="17">PERSONALIZE YOUR HOME SCREEN</text>
    <g transform="translate(48 136)">
      <rect width="884" height="226" rx="20" fill="#17283b" stroke="#415a76"/>
      <g transform="translate(28 28)">
        <rect width="84" height="84" rx="22" fill="#345a84"/>
        <g stroke="#d8e8fa" stroke-width="4" stroke-linecap="round"><path d="M22 26h40M22 42h40M22 58h40"/></g>
        <g fill="#d8e8fa"><circle cx="34" cy="26" r="4"/><circle cx="51" cy="42" r="4"/><circle cx="29" cy="58" r="4"/></g>
      </g>
      <text x="140" y="57" fill="#fff" font-family="sans-serif" font-size="24" font-weight="700">App appearance</text>
      <text x="140" y="88" fill="#aebfd3" font-family="sans-serif" font-size="17">Built-in launcher style · automatic columns</text>
      <g transform="translate(138 111)">
        <rect width="280" height="92" rx="14" fill="#243b55" stroke="#577594"/>
        <circle cx="45" cy="39" r="23" fill="#f0b844"/><path d="M34 34h22v12H34z" fill="#fff"/>
        <text x="82" y="38" fill="#fff" font-family="sans-serif" font-size="17" font-weight="700">Launcher icons</text>
        <text x="82" y="63" fill="#b9cbe0" font-family="sans-serif" font-size="14">Selected · fits screen</text>
        <rect x="292" width="280" height="92" rx="14" fill="#1e3045" stroke="#405873"/>
        <path d="M315 30h52v31h-52z" fill="#788ba4"/><text x="389" y="38" fill="#e7eff8" font-family="sans-serif" font-size="17">TV banners</text><text x="389" y="63" fill="#aebfd3" font-family="sans-serif" font-size="14">Large artwork · 4 × 2</text>
      </g>
    </g>
    <g transform="translate(48 386)">
      <rect width="884" height="152" rx="20" fill="#17283b" stroke="#415a76"/>
      <circle cx="70" cy="76" r="42" fill="#345a84"/><circle cx="70" cy="76" r="25" fill="#70d4aa"/>
      <text x="140" y="61" fill="#fff" font-family="sans-serif" font-size="23" font-weight="700">Icon shape</text>
      <text x="140" y="94" fill="#aebfd3" font-family="sans-serif" font-size="17">Match the circular mask used by the TV launcher</text>
      <text x="620" y="65" fill="#b9cbe0" font-family="sans-serif" font-size="15">ORIGINAL</text>
      <circle cx="687" cy="105" r="22" fill="#70d4aa"/>
      <rect x="738" y="75" width="132" height="58" rx="29" fill="#2d89df"/>
      <circle cx="839" cy="104" r="22" fill="#fff"/>
      <text x="751" y="62" fill="#b9cbe0" font-family="sans-serif" font-size="15">CIRCULAR · ON</text>
    </g>
    <g transform="translate(48 562)">
      <rect width="884" height="112" rx="20" fill="#17283b" stroke="#415a76"/>
      <circle cx="70" cy="56" r="34" fill="#345a84"/><text x="70" y="68" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="34">ⓘ</text>
      <text x="128" y="49" fill="#fff" font-family="sans-serif" font-size="23" font-weight="700">About Homeboard TV</text>
      <text x="128" y="79" fill="#aebfd3" font-family="sans-serif" font-size="16">Version · project details · open-source acknowledgements</text>
      <path d="m835 47 12 9-12 9" fill="none" stroke="#b9cbe0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(48 704)">
      <rect width="884" height="88" rx="20" fill="#17283b" stroke="#415a76"/>
      <circle cx="70" cy="44" r="30" fill="#345a84"/><text x="70" y="53" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="25">⌂</text>
      <text x="128" y="37" fill="#fff" font-family="sans-serif" font-size="21" font-weight="700">Default Home app</text>
      <text x="128" y="63" fill="#aebfd3" font-family="sans-serif" font-size="15">Choose… · Android confirms the Home button target</text>
      <path d="m835 35 12 9-12 9" fill="none" stroke="#b9cbe0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(48 812)">
      <rect width="884" height="88" rx="20" fill="#17283b" stroke="#415a76"/>
      <circle cx="70" cy="44" r="30" fill="#345a84"/><path d="M54 44h32M70 28v32" stroke="#dceafa" stroke-width="4" stroke-linecap="round"/>
      <text x="128" y="52" fill="#fff" font-family="sans-serif" font-size="22">Widgets · wallpaper · motion settings</text>
      <path d="m835 35 12 9-12 9" fill="none" stroke="#b9cbe0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
