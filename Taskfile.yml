version: '3'
includes:
  chromecast: Taskfile.chromecast.yml
tasks:
  bump:
    desc: Advance the Android APK version code and displayed subversion
    cmds: ['dev/container.sh run ./gradlew --no-daemon :app:bumpVersion']
  deploy:
    desc: Bump, check, build and deploy the same numbered APK to Cast1 and Cast2
    cmds:
      - task: bump
      - task: check
      - task: build
      - 'python3 dev/deploy.py --device "{{.DEVICE | default "chromecast-test-01,chromecast-test-02"}}" --recipe "{{.RECIPE | default "dev/device/install-only.json"}}"'
  fixture:
    desc: Build the disposable Android UI test app in the container
    cmds: ['dev/container.sh run ./gradlew --no-daemon :fixture:assembleDebug']
  build-image:
    desc: Build the shared local and CI toolchain image
    cmds: ['dev/container.sh image']
  dev-shell:
    desc: Open a shell in the build container
    cmds: ['dev/container.sh run bash']
  run:
    desc: Run a command inside the build container
    cmds: ['dev/container.sh run {{.CLI_ARGS}}']
  check:
    desc: Run calendar pipeline checks, Java tests and Android lint
    cmds:
      - task: calendar:check
      - 'dev/container.sh run python3 /workspace/dev/test_deploy.py'
      - 'dev/container.sh run ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug'
  build:
    desc: Build the Homeboard debug APK without installing
    cmds: ['dev/container.sh run ./gradlew --no-daemon :app:assembleDebug']
  bundle:
    desc: Build an unsigned release App Bundle
    cmds: ['dev/container.sh run ./gradlew --no-daemon :app:bundleRelease']
  md:
    desc: Render, verify Mermaid output and open project Markdown
    cmds: ['dev/render-markdown.sh {{.CLI_ARGS}}']
  wallpaper-fixture:
    desc: Build the debug-only offline wallpaper provider library
    cmds: ['dev/container.sh run ./gradlew --no-daemon :wallpaper-fixture:assembleDebug']
  i18n:check:
    desc: Validate English/Thai Homeboard resource parity in the build container
    cmds: ['dev/container.sh run ./gradlew --no-daemon :app:checkTranslations']

  calendar:normalize:
    desc: Normalize reviewed calendar facts into provider JSON in the container
    cmds: ['dev/container.sh run python3 /workspace/dev/calendar/normalize.py --input /workspace/dev/calendar/reviewed --output /workspace/dev/calendar/providers']
  calendar:assemble:
    desc: Validate provider JSON and atomically assemble the calendar asset
    cmds: ['dev/container.sh run python3 /workspace/dev/calendar/assemble.py --input /workspace/dev/calendar/providers --output /workspace/launcher/app/src/main/assets/calendar-snapshot.json']
  calendar:check:
    desc: Test JSON normalization, replay and atomic snapshot publication in the container
    cmds: ['dev/container.sh run python3 /workspace/dev/calendar/test_pipeline.py']
