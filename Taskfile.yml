version: '3'
includes:
  chromecast: Taskfile.chromecast.yml
tasks:
  bump:
    desc: Advance the Android APK version code and displayed subversion
    cmds: ['dev/container.sh run ./gradlew --no-daemon :app:bumpVersion']
  deploy:
    desc: Bump, check, build and deploy the same numbered APK to Cast1 and Cast2
    cmds:
      - task: bump
      - task: check
      - task: build
      - 'python3 dev/deploy.py --device "{{.DEVICE | default "chromecast-test-01,chromecast-test-02"}}" --recipe "{{.RECIPE | default "dev/device/install-only.json"}}"'
  fixture:
    desc: Build the disposable Android UI test app in the container
    cmds: ['dev/container.sh run ./gradlew --no-daemon :fixture:assembleDebug']
  build-image:
    desc: Build the shared local and CI toolchain image
    cmds: ['dev/container.sh image']
  dev-shell:
    desc: Open a shell in the build container
    cmds: ['dev/container.sh run bash']
  run:
    desc: Run a command inside the build container
    cmds: ['dev/container.sh run {{.CLI_ARGS}}']
  cleanup:check:
    desc: Verify copied cleanup code and run fake-TV recovery/fault tests in the container
    cmds: ['dev/container.sh run python3 /workspace/dev/test_cleanup.py']
  cleanup:standalone:
    desc: Open the standalone TV connection companion in the existing tool container (Linux)
    cmds: ['bash dev/cleanup-standalone.sh {{.CLI_ARGS}}']
  cleanup:serve:
    desc: Open the local read-only TV cleanup inspection companion
    cmds: ['python3 dev/cleanup_companion.py {{.CLI_ARGS}}']
  cleanup:connection-browser-check:
    desc: Verify standalone connection controls using browser fixtures
    cmds:
      - 'docker run --rm -v "{{.ROOT_DIR}}:/workspace" -w /workspace mcr.microsoft.com/playwright:v1.59.1-noble node dev/cleanup-connection-browser-check.cjs'
  cleanup:browser-check:
    desc: Verify English/Thai cleanup inspection in Chromium and WebKit
    cmds:
      - 'docker run --rm -v "{{.ROOT_DIR}}:/workspace" -w /workspace mcr.microsoft.com/playwright:v1.59.1-noble node dev/cleanup-browser-check.cjs'
  check:
    desc: Run calendar pipeline checks, Java tests and Android lint
    cmds:
      - task: calendar:check
      - task: cleanup:check
      - 'dev/container.sh run python3 /workspace/dev/test_deploy.py'
      - 'dev/container.sh run ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug'
  phone:setup:
    desc: Install pinned test-only browser packages inside the browser container
    cmds:
      - 'docker run --rm -v "{{.ROOT_DIR}}:/workspace" -w /workspace mcr.microsoft.com/playwright:v1.59.1-noble npm install --prefix artifacts/phone-browser --no-save playwright@1.59.1 jsqr@1.4.0 pngjs@7.0.0'
  grocery:check:
    desc: Verify grocery quantities, draft conflicts and phone entry in containers
    cmds:
      - 'docker run --rm -v "{{.ROOT_DIR}}:/workspace" -w /workspace mcr.microsoft.com/playwright:v1.59.1-noble node dev/grocery-model-check.cjs'
      - 'docker run --rm -v "{{.ROOT_DIR}}:/workspace" -w /workspace mcr.microsoft.com/playwright:v1.59.1-noble node dev/grocery-phone-check.cjs'
  phone:check:
    desc: Check phone draft logic and Chromium/WebKit touch interactions in a container
    cmds:
      - 'docker run --rm -v "{{.ROOT_DIR}}:/workspace" -w /workspace mcr.microsoft.com/playwright:v1.59.1-noble node dev/phone-model-check.cjs'
      - 'docker run --rm -v "{{.ROOT_DIR}}:/workspace" -w /workspace mcr.microsoft.com/playwright:v1.59.1-noble node dev/phone-browser-check.cjs'
      - 'docker run --rm -v "{{.ROOT_DIR}}:/workspace" -w /workspace mcr.microsoft.com/playwright:v1.59.1-noble node dev/world-clock-model-check.cjs'
      - 'docker run --rm -v "{{.ROOT_DIR}}:/workspace" -w /workspace mcr.microsoft.com/playwright:v1.59.1-noble node dev/world-clock-phone-check.cjs'
  build:
    desc: Build the Homeboard debug APK without installing
    cmds: ['dev/container.sh run ./gradlew --no-daemon :app:assembleDebug']
  bundle:
    desc: Build an unsigned release App Bundle
    cmds: ['dev/container.sh run ./gradlew --no-daemon :app:bundleRelease']
  md:
    desc: Render, verify Mermaid output and open project Markdown
    cmds: ['dev/render-markdown.sh {{.CLI_ARGS}}']
  wallpaper-fixture:
    desc: Build the debug-only offline wallpaper provider library
    cmds: ['dev/container.sh run ./gradlew --no-daemon :wallpaper-fixture:assembleDebug']
  i18n:check:
    desc: Validate English/Thai Homeboard resource parity in the build container
    cmds: ['dev/container.sh run ./gradlew --no-daemon :app:checkTranslations']

  calendar:normalize:
    desc: Normalize reviewed calendar facts into provider JSON in the container
    cmds: ['dev/container.sh run python3 /workspace/dev/calendar/normalize.py --input /workspace/dev/calendar/reviewed --output /workspace/dev/calendar/providers']
  calendar:replay:
    desc: Replay captured official holiday documents with the native Java modules
    cmds: ['dev/container.sh run python3 /workspace/dev/calendar/replay.py {{.CLI_ARGS}}']
  calendar:proof:
    desc: Capture native calendar cache/source UI acceptance through the coordinator
    cmds: ['python3 dev/calendar-data-proof.py {{.CLI_ARGS}}']
  calendar:assemble:
    desc: Validate provider JSON and atomically assemble the calendar asset
    cmds: ['dev/container.sh run python3 /workspace/dev/calendar/assemble.py --input /workspace/dev/calendar/providers --output /workspace/launcher/app/src/main/assets/calendar-snapshot.json']
  calendar:check:
    desc: Test JSON normalization, replay and atomic snapshot publication in the container
    cmds: ['dev/container.sh run python3 /workspace/dev/calendar/test_pipeline.py']
