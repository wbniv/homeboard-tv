plugins {
    id 'com.android.application'
}

def versionFile = rootProject.file('../version.properties')
def appVersion = new Properties()
versionFile.withInputStream { appVersion.load(it) }
def apkVersionCode = appVersion.getProperty('version_code').toInteger()
def versionPrefix = "${appVersion.getProperty('major')}.${appVersion.getProperty('minor')}"
if (!(versionPrefix ==~ /\d+\.\d+/) || apkVersionCode < 1 || apkVersionCode > 2100000000) {
    throw new GradleException('Invalid version.properties')
}

tasks.register('bumpVersion') {
    group = 'versioning'
    description = 'Advance the Android version code for the next deployment'
    doLast {
        def current = new Properties()
        versionFile.withInputStream { current.load(it) }
        def next = current.getProperty('version_code').toInteger() + 1L
        if (next > 2100000000) throw new GradleException('Android version code limit reached')
        versionFile.text = "major=${current.getProperty('major')}\nminor=${current.getProperty('minor')}\nversion_code=${next}\n"
        println "Next deployment: ${current.getProperty('major')}.${current.getProperty('minor')}.${next} (versionCode ${next})"
    }
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Independent package identity; keep the upstream Java namespace for focused diffs.
        applicationId 'net.biohack.homeboard'
        minSdk 26
        targetSdk 34
        versionCode apkVersionCode
        versionName "${versionPrefix}.${apkVersionCode}"
    }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release stays unsigned until Homeboard production signing is configured.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':projectivy-api')
    debugImplementation project(':wallpaper-fixture')
    implementation 'com.airbnb.android:lottie:6.6.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.zxing:core:3.5.4'
    testImplementation 'org.json:json:20240303'
}
