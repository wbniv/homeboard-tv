plugins { id 'com.android.application' }

def appVersion = new Properties()
rootProject.file('../version.properties').withInputStream { appVersion.load(it) }
android {
    namespace 'com.gathin.tvhome'
    compileSdk 34
    defaultConfig {
        applicationId 'net.biohack.homeboard.tester'
        minSdk 26
        targetSdk 34
        versionCode appVersion.getProperty('version_code').toInteger()
        versionName "${appVersion.getProperty('major')}.${appVersion.getProperty('minor')}.${versionCode}"
        resourceConfigurations += ["en", "th"]
    }
    signingConfigs {
        debug {
            storeFile file('/run/homeboard-debug-signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    sourceSets {
        main {
            java.srcDirs = ['../app/src/main/java', 'shared']
            res.srcDirs = ['../app/src/main/res', 'src/main/res']
            assets.srcDirs = ['../app/src/main/assets']
        }
    }
    buildTypes {
        debug {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    lint { lintConfig file('lint.xml') }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation project(':projectivy-api')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.airbnb.android:lottie:6.6.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
